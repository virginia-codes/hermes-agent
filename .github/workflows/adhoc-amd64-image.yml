name: Ad-hoc amd64 image build

# One-off, self-contained build: produces a linux/amd64 image on a native
# (non-emulated) GitHub-hosted runner and uploads it as a downloadable
# artifact. Unlike docker.yml, this needs no registry credentials — it
# never pushes anywhere, just `docker save`s the result for local use
# (e.g. `docker load < hermes-agent-amd64.tar.gz` on an amd64 Linux host).
on:
  workflow_dispatch:
  push:
    branches: [claude/adhoc-amd64-image-build]

permissions:
  contents: read

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: hermes-agent:amd64
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}

      - name: Save image
        run: docker save hermes-agent:amd64 | gzip > hermes-agent-amd64.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-agent-amd64
          path: hermes-agent-amd64.tar.gz
          retention-days: 3
